<!doctype html>
<html lang="en" data-theme="glass-porcelain">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Zarf</title>
    <meta name="description" content="Send USDC to any email, from any chain. They claim with Google; the email never goes on chain." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F8F8FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <!-- Link previews: every route is the same shell (ssr = false), so a claim link previews as this. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zarf" />
    <meta property="og:title" content="Zarf: tokens sent to an email" />
    <meta property="og:description" content="Claim them with a Google sign-in. The email never goes on chain." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zarf: send tokens to an email." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zarf: tokens sent to an email" />
    <meta name="twitter:description" content="Claim them with a Google sign-in. The email never goes on chain." />
    <meta name="twitter:image" content="/og.png" />
    <!-- Theme before first paint, as the main claim app's app.html: the saved choice, else dark (saved). -->
    <script nonce="%sveltekit.nonce%">
      (function () {
        try {
          var t = localStorage.getItem('zarf_theme');
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
            localStorage.setItem('zarf_theme', 'dark');
          }
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'paper-porcelain' : 'glass-porcelain');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Saira 400-700 (variable), latin subset, self-hosted (SIL OFL: /fonts/Saira-OFL.txt): no font CDN. */
      @font-face {
        font-family: 'Saira';
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/saira-latin.woff2') format('woff2');
      }
      /* First paint: the ground and the boot mark, before the app's stylesheet arrives. */
      html[data-theme='glass-porcelain'] { background: #0a0a0b; }
      html[data-theme='paper-porcelain'] { background: #f8f8fa; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; color: #8a8a93; font: 14px/1.4 'Saira', ui-sans-serif, system-ui, sans-serif; }
      #boot svg { opacity: 0.6; }
      html[data-theme='paper-porcelain'] #boot { color: #5c5c66; }
      body:has(#main) #boot { display: none; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="off">
    <!-- Until the app starts (it renders in the browser only): the mark and one line, never a blank page. -->
    <div id="boot" role="status">
      <svg width="28" height="28" viewBox="0 0 11 11" fill="currentColor"><path d="M0.898438 10.3896C0.394295 10.3384 0.000100606 9.91217 8.74228e-08 9.39453L8.21296e-07 0.999999L0.00586021 0.898437C0.0535571 0.427762 0.427821 0.0537464 0.898438 0.00585854L1 -8.21296e-07L9.39453 -8.74228e-08L9.49707 0.0058593C9.96765 0.0538002 10.342 0.427778 10.3896 0.898437L10.3945 1L10.3945 9.39453C10.3944 9.94672 9.94675 10.3945 9.39453 10.3945L1 10.3945L0.898438 10.3896ZM9.39453 6.0293L7.3457 7.21191C7.19382 7.2996 7.02108 7.34562 6.8457 7.3457L3.40918 7.3457L3.40918 6.3457L6.8457 6.3457L9.39453 4.875L9.39453 1L1 0.999999L1 4.34766L3.0752 3.14844C3.227 3.06088 3.39995 3.01473 3.5752 3.01465L7.01172 3.01465L7.01172 4.01465L3.5752 4.01465L1 5.50195L1 9.39453L9.39453 9.39453L9.39453 6.0293Z"/></svg>
      <span id="boot-line">Opening Zarf…</span>
      <noscript><style>#boot-line { display: none; }</style>Zarf needs JavaScript to open this link.</noscript>
      <script nonce="%sveltekit.nonce%">
        if (/^\/claim\//.test(location.pathname)) document.getElementById('boot-line').textContent = 'Opening your claim…';
      </script>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
